<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>FASIH Extensions — Hasil</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f7fa; color: #1a1a2e; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { background: linear-gradient(135deg, #1a5276, #2e86c1); color: white; padding: 16px 20px; border-radius: 8px 8px 0 0; }
    .header h1 { font-size: 18px; } .header .meta { font-size: 12px; opacity: 0.8; margin-top: 4px; }
    .toolbar { background: #fff; padding: 12px 20px; border-bottom: 1px solid #e0e0e0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .toolbar .info { font-size: 13px; color: #555; flex: 1; }
    .btn { padding: 8px 16px; border: 1px solid #ddd; border-radius: 4px; background: #fff; cursor: pointer; font-size: 13px; font-weight: 500; }
    .btn:hover { background: #f0f0f0; }
    .btn-primary { background: #1a5276; color: white; border-color: #1a5276; }
    .btn-primary:hover { background: #154360; }
    .table-wrap { background: #fff; border-radius: 0 0 8px 8px; overflow-x: auto; max-height: 600px; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { position: sticky; top: 0; background: #f8f9fa; padding: 8px 10px; text-align: left; border-bottom: 2px solid #ddd; font-weight: 600; white-space: nowrap; }
    td { padding: 6px 10px; border-bottom: 1px solid #f0f0f0; white-space: nowrap; max-width: 300px; overflow: hidden; text-overflow: ellipsis; }
    tr:hover td { background: #f7f9fc; }
    .empty { text-align: center; padding: 40px; color: #999; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>FASIH Extensions — Hasil Ekstraksi</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="toolbar">
      <span class="info" id="info">Memuat...</span>
      <button class="btn btn-primary" id="btn-csv" disabled>⬇️ Download CSV</button>
      <button class="btn" id="btn-json" disabled>⬇️ Download JSON</button>
    </div>
    <div class="table-wrap" id="table-wrap"><div class="empty">Memuat data...</div></div>
  </div>

  <script src="results.js"></script>
</body>
</html>
